components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── AUTH ─────────────────────────────────────────────────────────────────
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        avatarUrl:
          type: string
        phone:
          type: string
          nullable: true
        isClient:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isClient

    # ── USER ─────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        isActive:
          type: boolean
        isClient:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - isClient
        - createdAt

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        phone:
          type: string
        isClient:
          type: boolean
      required:
        - email
        - password
        - firstName
        - lastName
        - role

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        phone:
          type: string
        isActive:
          type: boolean

    PaginatedUsers:
      type: object
      properties:
