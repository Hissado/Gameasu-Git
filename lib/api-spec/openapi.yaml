    # ── KIOSK ─────────────────────────────────────────────────────────────────
    KioskIdentifyInput:
      type: object
      required: [code, kioskToken]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 4
        kioskToken:
          type: string

    KioskIdentifyResult:
      type: object
      required: [collaborator, kiosk]
      properties:
        collaborator:
          type: object
          required: [id, firstName, lastName]
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            position: { type: ["string", "null"] }
            photoUrl: { type: ["string", "null"] }
        kiosk:
          type: object
          required: [id, name, organizationId]
          properties:
            id: { type: string }
            name: { type: string }
            location: { type: ["string", "null"] }
            organizationId: { type: string }
            settings:
              type: object
              additionalProperties: true

    KioskPunchInput:
      type: object
      required: [kioskToken, collaboratorId, kind]
      properties:
        kioskToken: { type: string }
        collaboratorId: { type: string }
        kind:
          type: string
          enum: [clock_in, clock_out, break_start, break_end]
        photoDataUrl: { type: string }

    KioskPunchResult:
      type: object
      required: [success, kind]
      properties:
        success: { type: boolean }
        recordId: { type: ["string", "null"] }
        kind: { type: string }
        occurredAt: { type: ["string", "null"], format: date-time }

    Kiosk:
      type: object
      required: [id, organizationId, name, isActive, token]
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        isActive: { type: boolean }
        token: { type: string }
        settings:
          type: object
          additionalProperties: true
        lastSeenAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KioskInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        location: { type: string }
        description: { type: string }
        settings:
          type: object
          additionalProperties: true

    KioskUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        location: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        settings:
          type: object
          additionalProperties: true

    KioskCodeUpdate:
      type: object
      required: [kioskCode]
      properties:
        kioskCode:
          type: ["string", "null"]

