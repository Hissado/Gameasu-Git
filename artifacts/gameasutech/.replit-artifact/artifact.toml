kind = "web"
previewPath = "/gameasutech/"
title = "Gaméasù Technology"
version = "1.0.0"
id = "artifacts/gameasutech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/gameasutech/" ]
localPort = 20127

[services.development]
run = "pnpm --filter @workspace/gameasutech run dev"

[services.production]
build = [ "bash", "-c", "BASE_PATH=/ pnpm --filter @workspace/gameasutech run build" ]
publicDir = "artifacts/gameasutech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20127"
BASE_PATH = "/gameasutech/"
