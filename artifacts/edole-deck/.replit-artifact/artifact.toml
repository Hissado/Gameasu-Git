kind = "slides"
previewPath = "/edole-deck/"
title = "EDOLE Deck"
version = "1.0.0"
id = "artifacts/edole-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/edole-deck/" ]
localPort = 20581

[services.development]
run = "pnpm --filter @workspace/edole-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edole-deck", "run", "build" ]
publicDir = "artifacts/edole-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20581"
BASE_PATH = "/edole-deck/"
